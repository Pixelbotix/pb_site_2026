<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="description" content="Execution-focused robotics, AI, and drone workshops by PixelBotix Technologies." />

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = { 
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pbBlue: '#3b82f6',
            pbEmerald: '#10b981',
            pbAmber: '#f59e0b',
          }
        }

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  
  <link rel="stylesheet" href="/assets/css/layout.css">

  <style>
    /* --- FIX: NAVBAR DROPDOWNS --- */
    /* Forces dropdowns to hide and only show on hover if layout.js is failing */
    #site-navbar ul li ul {
      display: none;
      position: absolute;
      z-index: 50;
    }
    #site-navbar ul li:hover > ul {
      display: block;
    }

    /* --- LOGO MARQUEE ANIMATION --- */
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .logo-marquee {
      display: flex;
      width: max-content;
      animation: scroll 30s linear infinite;
    }
    .logo-marquee:hover { animation-play-state: paused; }

    /* --- VIBRANT TOGGLES --- */
    .filter-btn {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* Category States */
    .cat-btn[data-type="offline"].active {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
      border-color: transparent;
    }
    .cat-btn[data-type="online"].active {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
      border-color: transparent;
    }
    .cat-btn[data-type="academic"].active {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
      box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4);
      border-color: transparent;
    }

    /* Timeline Sliding Toggle */
    .timeline-btn.active {
      background-color: #111827;
      color: white;
    }
    .dark .timeline-btn.active {
      background-color: #ffffff;
      color: #111827;
    }

    /* Workshop Card Hover */
    .workshop-card {
      transition: all 0.4s ease;
    }
    .filter-hidden { display: none; opacity: 0; }
  </style>
</head>

<div id="site-footer"></div>

<script>
  let activeState = { category: 'offline', status: 'upcoming' };

  function setPrimary(val, btn) {
    activeState.category = val;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  function setStatus(val, btn) {
    activeState.status = val;
    document.querySelectorAll('.timeline-btn').forEach(b => {
      b.classList.remove('active');
      b.classList.add('text-gray-500'); 
    });
    btn.classList.add('active');
    btn.classList.remove('text-gray-500');
    applyFilters();
  }

  function applyFilters() {
    const cards = document.querySelectorAll('.workshop-card');
    let count = 0;

    cards.forEach(card => {
      const match = card.dataset.category === activeState.category && card.dataset.status === activeState.status;
      if (match) {
        card.classList.remove('filter-hidden');
        count++;
      } else {
        card.classList.add('filter-hidden');
      }
    });

    document.getElementById('no-results').classList.toggle('hidden', count > 0);
    document.getElementById('workshop-grid').classList.toggle('hidden', count === 0);
  }

  document.addEventListener("DOMContentLoaded", applyFilters);
</script>

<script src="/assets/js/layout.js"></script>
